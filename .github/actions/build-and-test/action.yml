name: 'Build and Test Docker Target'
description: >
  Build one Docker target for one Python version with registry layer-caching,
  run its test suite, scan it with Trivy, and optionally push it to ghcr.io as
  :<target>-py<X.Y> (+ -<sha>), and as :<target> (+ -<sha>) for the default Python.

inputs:
  target:
    description: 'Docker build target name (base, scientific, ml, …)'
    required: true
  python-version:
    description: 'Python version to build (the PYTHON_VERSION build arg, e.g. 3.14)'
    required: true
  default-python:
    description: "The target's default Python version; that build also gets the plain :<target> tags"
    required: true
  cache-scopes:
    description: 'Extra cache scope names beyond this target, space-separated (e.g. "base scientific")'
    required: false
    default: ''
  push:
    description: 'Push the image to ghcr.io after tests pass (true/false)'
    required: false
    default: 'false'
  image-name:
    description: 'Full image name without tag (e.g. ghcr.io/owner/repo)'
    required: true
  registry-token:
    description: 'Token for ghcr.io authentication (usually secrets.GITHUB_TOKEN)'
    required: true
  free-disk-space:
    description: 'Remove unused preinstalled toolchains first (for multi-GB targets)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Login before the build: pulls the registry build cache, and lets
    # cache-to write it back on main. PR tokens are read-only, which is enough
    # for cache-from.
    - name: Login to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.registry-token }}

    - name: Compose cache references
      id: cache
      shell: bash
      env:
        IMAGE: ${{ inputs.image-name }}
        TARGET: ${{ inputs.target }}
        PY: ${{ inputs.python-version }}
        EXTRA_SCOPES: ${{ inputs.cache-scopes }}
        PUSH: ${{ inputs.push }}
      run: |
        # Cache scopes are per Python version: a 3.13 and a 3.14 chain share no layers.
        {
          echo 'cache_from<<EOF'
          echo "type=registry,ref=${IMAGE}/buildcache:${TARGET}-py${PY}"
          for scope in ${EXTRA_SCOPES}; do
            echo "type=registry,ref=${IMAGE}/buildcache:${scope}-py${PY}"
          done
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
        if [ "${PUSH}" = "true" ]; then
          echo "cache_to=type=registry,ref=${IMAGE}/buildcache:${TARGET}-py${PY},mode=max" >> "$GITHUB_OUTPUT"
        else
          echo "cache_to=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build ${{ inputs.target }} (Python ${{ inputs.python-version }})
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: ${{ inputs.target }}
        build-args: PYTHON_VERSION=${{ inputs.python-version }}
        tags: ds-${{ inputs.target }}
        load: true
        cache-from: ${{ steps.cache.outputs.cache_from }}
        cache-to: ${{ steps.cache.outputs.cache_to }}

    - name: Test ${{ inputs.target }}
      shell: bash
      run: ./build-all.sh --test-only ${{ inputs.target }}

    # Track image size so toolchain/dependency changes surface as size regressions.
    # Reports the uncompressed size (what `docker images` shows) and the gzip size
    # (≈ the ghcr pull size). Non-fatal: sizing must never fail a build.
    - name: Report ${{ inputs.target }} image size
      shell: bash
      continue-on-error: true
      env:
        TARGET: ${{ inputs.target }}
        PY: ${{ inputs.python-version }}
      run: |
        img="ds-${TARGET}"
        uncompressed=$(docker image inspect "$img" --format '{{.Size}}')
        compressed=$(docker save "$img" | gzip -1 | wc -c)
        u_mb=$(( uncompressed / 1024 / 1024 ))
        c_mb=$(( compressed / 1024 / 1024 ))
        echo "size ${img}: uncompressed=${u_mb}MB compressed(gzip)=${c_mb}MB"
        {
          echo "### Image size — ${TARGET} (Python ${PY})"
          echo ""
          echo "| metric | MB |"
          echo "| --- | --- |"
          echo "| uncompressed | ${u_mb} |"
          echo "| compressed (gzip -1) | ${c_mb} |"
        } >> "$GITHUB_STEP_SUMMARY"

    # Report-only for now: surfaces HIGH/CRITICAL CVEs in the job log without
    # blocking the pipeline. Tighten to exit-code 1 once a baseline is triaged.
    - name: Scan ${{ inputs.target }} with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ds-${{ inputs.target }}
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '0'
        # Multi-GB ML images (deeplearn, face, full) exceed Trivy's 5m default.
        timeout: 30m

    - name: Push ${{ inputs.target }} (Python ${{ inputs.python-version }}) to ghcr.io
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image-name }}
        TARGET: ${{ inputs.target }}
        PY: ${{ inputs.python-version }}
        DEFAULT_PY: ${{ inputs.default-python }}
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        tags=("${IMAGE}:${TARGET}-py${PY}" "${IMAGE}:${TARGET}-py${PY}-${SHORT_SHA}")
        # The default Python's build also owns the plain tags users pull by name.
        if [ "${PY}" = "${DEFAULT_PY}" ]; then
          tags+=("${IMAGE}:${TARGET}" "${IMAGE}:${TARGET}-${SHORT_SHA}")
        fi
        for tag in "${tags[@]}"; do
          docker tag "ds-${TARGET}" "${tag}"
        done
        # ghcr occasionally races on blobs shared between parallel jobs
        # ("unknown blob"); a short retry rides it out.
        push_all() {
          local tag
          for tag in "${tags[@]}"; do
            docker push "${tag}" || return 1
          done
        }
        for attempt in 1 2 3; do
          if push_all; then
            exit 0
          fi
          echo "push attempt ${attempt} failed; retrying in $((attempt * 20))s"
          sleep $((attempt * 20))
        done
        echo "all push attempts failed"
        exit 1
