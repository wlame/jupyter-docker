name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly rebuild so published images pick up OS security patches.
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

# Cancel in-flight PR runs on new pushes; never cancel a main publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ─── Tier 0 — fast gates (no Docker builds) ─────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Lint shell and Python
        run: just lint
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008
          failure-threshold: warning

  consistency:
    name: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Verify generated files match the matrix
        run: just gen-check
      - name: Verify lockfiles are up to date
        run: just lock-check
      - name: Verify notebooks are in sync with .py sources
        run: just nb-check
      - name: Run generator tests
        run: just test-gen

  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pythons: ${{ steps.matrix.outputs.pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Read each target's Python versions from the matrix
        id: matrix
        run: echo "pythons=$(just python-matrix)" >> "$GITHUB_OUTPUT"

  # ─── Tier 1 ──────────────────────────────────────────────────────────────────
  base:
    name: base (py${{ matrix.python }})
    needs: [plan, lint, consistency]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).base }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: base
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).base[0] }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Tier 2 — parallel, all FROM base ────────────────────────────────────────
  scientific:
    name: scientific (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).scientific }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: scientific
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).scientific[0] }}
          cache-scopes: base
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  visualization:
    name: visualization (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).visualization }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: visualization
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).visualization[0] }}
          cache-scopes: base
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  dataio:
    name: dataio (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).dataio }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: dataio
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).dataio[0] }}
          cache-scopes: base
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  vision:
    name: vision (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).vision }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: vision
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).vision[0] }}
          cache-scopes: base
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  audio:
    name: audio (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).audio }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: audio
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).audio[0] }}
          cache-scopes: base
          free-disk-space: 'true'
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  nlp:
    name: nlp (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).nlp }}
