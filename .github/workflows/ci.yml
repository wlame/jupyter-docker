    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: nlp
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).nlp[0] }}
          cache-scopes: base
          free-disk-space: 'true'
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  speech:
    name: speech (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).speech }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
        with:
          target: speech
          python-version: ${{ matrix.python }}
          default-python: ${{ fromJSON(needs.plan.outputs.pythons).speech[0] }}
          cache-scopes: base
          free-disk-space: 'true'
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  face:
    name: face (py${{ matrix.python }})
    needs: [plan, base]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).face }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
