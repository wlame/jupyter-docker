          image-name: ${{ env.IMAGE_NAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Tier 3 — parallel, FROM scientific ──────────────────────────────────────
  ml:
    name: ml (py${{ matrix.python }})
    needs: [plan, scientific]
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons).ml }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-and-test
